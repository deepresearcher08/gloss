[[example]]
name = "gallery"
path = "../../examples/gallery.rs"

[[example]]
name = "presentation"
path = "../../examples/presentation.rs"

[[example]]
name = "hot_reload"
path = "../../examples/hot_reload.rs"

[[example]]
name = "control_center"
path = "../../examples/control_center.rs"
