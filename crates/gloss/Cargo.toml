[package]
name = "gloss"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gloss-core = { path = "../gloss-core" }
gloss-render = { path = "../gloss-render" }
gloss-layout = { path = "../gloss-layout" }
gloss-text = { path = "../gloss-text" }
gloss-widgets = { path = "../gloss-widgets" }
